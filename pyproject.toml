[project]
name = "spacedesigner"
version = "0.1.0"
description = "PhotoSpace: photo-grounded, budget-constrained interior redesign"
readme = "README.md"
requires-python = ">=3.11.9"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "objaverse==0.1.7",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I"]
